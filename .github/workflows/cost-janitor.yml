name: Cost Janitor

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  cost-janitor:
    name: Run Cost Janitor
    runs-on: ubuntu-latest

    services:
  localstack:
    image: localstack/localstack:3.8.1
    ports:
      - 4566:4566
    env:
      SERVICES: ec2,s3
      DEFAULT_REGION: us-east-1
      DEBUG: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for LocalStack
  run: |
    python - <<'PY'
    import json
    import time
    import urllib.request

    url = "http://localhost:4566/_localstack/health"

    for attempt in range(1, 61):
        try:
            with urllib.request.urlopen(url, timeout=5) as response:
                body = response.read().decode("utf-8")
                print(body)

                if response.status == 200:
                    data = json.loads(body)
                    services = data.get("services", {})

                    ec2_status = services.get("ec2")
                    s3_status = services.get("s3")

                    if ec2_status in ("available", "running") and s3_status in ("available", "running"):
                        print("LocalStack is ready")
                        raise SystemExit(0)

        except Exception as error:
            print(f"Waiting for LocalStack... attempt {attempt}/60: {error}")

        time.sleep(2)

    print("LocalStack did not become ready in time")
    raise SystemExit(1)
    PY

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install terraform-local
          pip install -r janitor/requirements.txt

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: tflocal init

      - name: Terraform validate
        working-directory: terraform
        run: tflocal validate

      - name: Apply Terraform to LocalStack
        working-directory: terraform
        run: tflocal apply -auto-approve

      - name: Run Cost Janitor dry-run
        id: janitor
        continue-on-error: true
        run: |
          python janitor/janitor.py --dry-run --json-output report.json --md-output report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload Cost Janitor reports
        uses: actions/upload-artifact@v4
        with:
          name: cost-janitor-reports
          path: |
            report.json
            report.md

      - name: Comment report on PR
        if: github.event_name == 'pull_request' && steps.janitor.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const summary = fs.readFileSync("report.md", "utf8");

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Fail workflow if findings exist
        if: steps.janitor.outputs.exit_code != '0'
        run: |
          echo "Cost Janitor found orphaned or non-compliant resources."
          exit 1